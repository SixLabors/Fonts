<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emoji presentation browser comparison</title>
  <style>
    @font-face {
      font-family: "Presentation DejaVu Sans";
      src: url("../Fonts/DejaVuSans.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: "Presentation Noto Color Emoji";
      src: url("../Fonts/NotoColorEmoji-Regular.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: "Presentation Arial";
      src: url("../Fonts/arial.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: "Presentation Segoe UI Emoji";
      src: url("../Fonts/seguiemj-win11.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
    }

    @font-face {
      font-family: "Presentation Segoe UI Emoji 1.70";
      src: url("../Fonts/seguiemj-win11-1.70.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #111;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    header,
    section {
      padding: 16px 20px;
      border-bottom: 1px solid #ccc;
    }

    h1,
    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
    }

    .sample {
      margin: 0;
      color: #000;
      background: #fff;
      font-size: 30pt;
      font-kerning: normal;
      line-height: 1.4;
      white-space: pre;
    }

    .comparison {
      display: grid;
      grid-template-columns: max-content max-content;
      gap: 24px;
      align-items: start;
      overflow-x: auto;
    }

    figure {
      margin: 0;
    }

    figcaption {
      margin-bottom: 8px;
      color: #555;
      font-size: 13px;
    }

    .actual-output {
      display: block;
      max-width: none;
    }

    .dejavu-noto {
      font-family: "Presentation DejaVu Sans", "Presentation Noto Color Emoji";
    }

    .noto-dejavu {
      font-family: "Presentation Noto Color Emoji", "Presentation DejaVu Sans";
    }

    .arial-segoe-dejavu {
      font-family: "Presentation Arial", "Presentation Segoe UI Emoji", "Presentation DejaVu Sans";
    }

    .arial-segoe170-dejavu {
      font-family: "Presentation Arial", "Presentation Segoe UI Emoji 1.70", "Presentation DejaVu Sans";
    }

    .segoe170 {
      font-family: "Presentation Segoe UI Emoji 1.70";
    }

    .hand {
      font-size: 192pt;
      /* The library moves a first line's baseline down by the ink that rises above the
         font's ascender so the bitmap holds it; the browser lets that ink overflow. The
         thumb tip of the toned thumbs-up reaches 1740 units against Segoe UI Emoji's
         ascender of 1491, so the browser copy moves down by that overshoot: 24px at 192pt. */
      padding-top: 24px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Browser emoji presentation comparison</h1>
  </header>

  <section>
    <h2>DejaVu Sans, then Noto Color Emoji, 30pt</h2>
    <div class="comparison">
      <figure>
        <figcaption>Browser</figcaption>
        <p class="sample dejavu-noto">☀︎ ☀️ ☀ ☺︎ ☺️ ☺
🤷🏽‍♀️ 🤷🏽 👨‍👩‍👧‍👦 ❤️‍🔥
1️⃣ 🇯🇵 👍🏽 😀</p>
      </figure>
      <figure>
        <figcaption>SixLabors.Fonts actual output</figcaption>
        <img class="actual-output" src="../Images/ActualOutput/EmojiPresentation_BrowserComparison_DejaVuSans-NotoColorEmoji.png" alt="SixLabors.Fonts DejaVu Sans then Noto Color Emoji output">
      </figure>
    </div>
  </section>

  <section>
    <h2>Noto Color Emoji, then DejaVu Sans, 30pt</h2>
    <div class="comparison">
      <figure>
        <figcaption>Browser</figcaption>
        <p class="sample noto-dejavu">☀︎ ☀️ ☀ ☺︎ ☺️ ☺
🤷🏽‍♀️ 🤷🏽 👨‍👩‍👧‍👦 ❤️‍🔥
1️⃣ 🇯🇵 👍🏽 😀</p>
      </figure>
      <figure>
        <figcaption>SixLabors.Fonts actual output</figcaption>
        <img class="actual-output" src="../Images/ActualOutput/EmojiPresentation_BrowserComparison_NotoColorEmoji-DejaVuSans.png" alt="SixLabors.Fonts Noto Color Emoji then DejaVu Sans output">
      </figure>
    </div>
  </section>

  <section>
    <h2>Arial, then Segoe UI Emoji, then DejaVu Sans, 30pt</h2>
    <div class="comparison">
      <figure>
        <figcaption>Browser</figcaption>
        <p class="sample arial-segoe-dejavu">☀︎ ☀️ ☀ ☺︎ ☺️ ☺
🤷🏽‍♀️ 🤷🏽 👨‍👩‍👧‍👦 ❤️‍🔥
1️⃣ 🇯🇵 👍🏽 😀</p>
      </figure>
      <figure>
        <figcaption>SixLabors.Fonts actual output</figcaption>
        <img class="actual-output" src="../Images/ActualOutput/EmojiPresentation_BrowserComparison_Arial-SegoeUIEmoji-DejaVuSans.png" alt="SixLabors.Fonts Arial then Segoe UI Emoji then DejaVu Sans output">
      </figure>
    </div>
  </section>

  <section>
    <h2>Arial, then Segoe UI Emoji 1.70, then DejaVu Sans, 30pt</h2>
    <div class="comparison">
      <figure>
        <figcaption>Browser</figcaption>
        <p class="sample arial-segoe170-dejavu">☀︎ ☀️ ☀ ☺︎ ☺️ ☺
🤷🏽‍♀️ 🤷🏽 👨‍👩‍👧‍👦 ❤️‍🔥
1️⃣ 🇯🇵 👍🏽 😀</p>
      </figure>
      <figure>
        <figcaption>SixLabors.Fonts actual output</figcaption>
        <img class="actual-output" src="../Images/ActualOutput/EmojiPresentation_BrowserComparison_Arial-SegoeUIEmoji170-DejaVuSans.png" alt="SixLabors.Fonts Arial then Segoe UI Emoji 1.70 then DejaVu Sans output">
      </figure>
    </div>
  </section>
  <section>
    <h2>Segoe UI Emoji 1.70 toned thumbs-up, 192pt</h2>
    <div class="comparison">
      <figure>
        <figcaption>Browser</figcaption>
        <p class="sample segoe170 hand">👍🏽</p>
      </figure>
      <figure>
        <figcaption>SixLabors.Fonts actual output</figcaption>
        <img class="actual-output" src="../Images/ActualOutput/EmojiPresentation_BrowserComparison_Hand_SegoeUIEmoji170.png" alt="SixLabors.Fonts Segoe UI Emoji 1.70 toned thumbs-up output">
      </figure>
    </div>
  </section>
</body>
</html>
